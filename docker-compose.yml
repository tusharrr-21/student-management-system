# Local testing — mirrors Kubernetes service names
# Frontend: http://localhost:3000
# Backend:  http://localhost:5000

services:
  sms-backend-service:
    build: ./backend
    container_name: sms-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - sms-net

  sms-frontend:
    build: ./frontend
    container_name: sms-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://sms-backend-service:5000
    depends_on:
      - sms-backend-service
    restart: unless-stopped
    networks:
      - sms-net

networks:
  sms-net:
    driver: bridge
