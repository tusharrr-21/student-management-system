# Smart Student Management System — local run with Docker Engine / Compose
# From this folder: docker compose up --build
# UI: http://localhost:3000  |  API: http://localhost:5000/api

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: frontend
        EXPOSE_PORT: "3000"
    container_name: sms-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: backend
        EXPOSE_PORT: "5000"
    container_name: sms-backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
