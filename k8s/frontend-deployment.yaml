apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-frontend
  namespace: sms
  labels:
    app: sms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sms-frontend
  template:
    metadata:
      labels:
        app: sms-frontend
    spec:
      containers:
        - name: sms-frontend
          image: YOUR_DOCKERHUB_USERNAME/sms-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_URL
              value: "http://sms-backend-service:5000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
