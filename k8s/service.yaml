apiVersion: v1
kind: Service
metadata:
  name: sms-backend-service
  namespace: sms
  labels:
    app: sms-backend
spec:
  type: ClusterIP
  selector:
    app: sms-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: sms-frontend-service
  namespace: sms
  labels:
    app: sms-frontend
spec:
  type: NodePort
  selector:
    app: sms-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
