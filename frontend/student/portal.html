<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Dashboard | EduManage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="../css/student-portal.css" rel="stylesheet"/>
  <link href="../css/style.css" rel="stylesheet"/>
</head>
<body class="sp-body">
<nav class="sp-navbar">
  <div class="sp-navbar-brand"><i class="fas fa-graduation-cap"></i><span>EduManage</span><span class="sp-portal-badge">Student Portal</span></div>
  <div class="sp-navbar-right">
    <div class="sp-user"><div class="sp-avatar" id="spAvatar">?</div><div class="sp-user-info d-none d-md-block"><span class="sp-user-name" id="spName">Loading...</span><span class="sp-user-usn" id="spUsn"></span></div></div>
    <a href="#" class="sp-logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt me-1"></i><span class="d-none d-md-inline">Logout</span></a>
  </div>
</nav>
<div class="sp-wrapper">
  <aside class="sp-sidebar">
    <ul class="sp-nav">
      <li><a href="#" class="sp-nav-link active" onclick="show('overview',this)"><i class="fas fa-home"></i><span>Overview</span></a></li>
      <li><a href="#" class="sp-nav-link" onclick="show('profile',this)"><i class="fas fa-user-circle"></i><span>My Profile</span></a></li>
      <li><a href="#" class="sp-nav-link" onclick="show('attendance',this)"><i class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
      <li><a href="#" class="sp-nav-link" onclick="show('marks',this)"><i class="fas fa-chart-bar"></i><span>Marks</span></a></li>
      <li><a href="#" class="sp-nav-link" onclick="show('performance',this)"><i class="fas fa-chart-line"></i><span>Performance</span></a></li>
    </ul>
  </aside>
  <main class="sp-main" id="portalMain">
    <div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x text-success"></i><p class="mt-2 text-muted">Loading your dashboard...</p></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../js/api.js"></script>
<script>
let student, subjectMarks, avgMark, overallGrade, attendanceStatus;

function grade(m){if(m>=90)return{l:'A+',c:'success'};if(m>=80)return{l:'A',c:'success'};if(m>=70)return{l:'B',c:'primary'};if(m>=60)return{l:'C',c:'warning'};if(m>=50)return{l:'D',c:'warning'};return{l:'F',c:'danger'};}
function attSt(a){if(a>=85)return{l:'Excellent',c:'success'};if(a>=75)return{l:'Good',c:'primary'};if(a>=65)return{l:'Average',c:'warning'};return{l:'Low',c:'danger'};}

function show(id, el) {
  document.querySelectorAll('.sp-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sp-nav-link').forEach(l=>l.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if (id === 'performance') renderCharts();
  return false;
}

let chartsRendered = false;
function renderCharts() {
  if (chartsRendered) return;
  chartsRendered = true;
  const subjects = subjectMarks.map(s=>s.subject);
  const marks    = subjectMarks.map(s=>s.mark);
  const colors   = ['#4f46e5','#06b6d4','#10b981','#f59e0b','#ef4444'];
  new Chart(document.getElementById('barChart'),{type:'bar',data:{labels:subjects,datasets:[{label:'Marks',data:marks,backgroundColor:colors,borderRadius:8,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  new Chart(document.getElementById('radarChart'),{type:'radar',data:{labels:subjects,datasets:[{label:'Your Marks',data:marks,backgroundColor:'rgba(79,70,229,0.15)',borderColor:'#4f46e5',pointBackgroundColor:'#4f46e5',pointRadius:5,borderWidth:2}]},options:{responsive:true,scales:{r:{beginAtZero:true,max:100,ticks:{stepSize:20},grid:{color:'#e2e8f0'}}},plugins:{legend:{display:false}}}});
  const gc={};marks.forEach(m=>{const k=m>=90?'A+':m>=80?'A':m>=70?'B':m>=60?'C':m>=50?'D':'F';gc[k]=(gc[k]||0)+1;});
  const nz=Object.entries(gc).filter(([,v])=>v>0);
  new Chart(document.getElementById('doughnutChart'),{type:'doughnut',data:{labels:nz.map(([k])=>'Grade '+k),datasets:[{data:nz.map(([,v])=>v),backgroundColor:['#10b981','#4f46e5','#06b6d4','#f59e0b','#f97316','#ef4444'],borderWidth:3,borderColor:'#fff'}]},options:{cutout:'60%',plugins:{legend:{position:'bottom',labels:{padding:16,usePointStyle:true}}}}});
}

async function init() {
  try { await api.studentMe(); } catch { location.href = 'login.html'; return; }
  try {
    const { data: s } = await api.portalMe();
    student = s;
    subjectMarks = Object.entries(s.marks).map(([k,v])=>({subject:k.charAt(0).toUpperCase()+k.slice(1),key:k,mark:v,grade:grade(v)}));
    avgMark = Math.round(subjectMarks.reduce((a,s)=>a+s.mark,0)/subjectMarks.length);
    overallGrade = grade(avgMark);
    attendanceStatus = attSt(s.attendance);

    document.getElementById('spAvatar').textContent = s.name.charAt(0);
    document.getElementById('spName').textContent   = s.name;
    document.getElementById('spUsn').textContent    = s.usn;

    document.getElementById('portalMain').innerHTML = buildPortal();
  } catch(e) { console.error(e); location.href = 'login.html'; }
}

function buildPortal() {
  const s = student, sm = subjectMarks, avg = avgMark, og = overallGrade, as_ = attendanceStatus;
  return `
  <section id="overview" class="sp-section active">
    <div class="sp-welcome-banner">
      <div class="sp-welcome-text"><h2>Welcome back, ${s.name.split(' ')[0]}! 👋</h2><p>${s.department} &nbsp;·&nbsp; Semester ${s.semester} &nbsp;·&nbsp; ${s.usn}</p></div>
      <div class="sp-welcome-icon d-none d-md-flex"><i class="fas fa-user-graduate"></i></div>
    </div>
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="sp-stat-card sp-stat-blue"><div class="sp-stat-icon"><i class="fas fa-calendar-check"></i></div><div class="sp-stat-val">${s.attendance}%</div><div class="sp-stat-lbl">Attendance</div><div class="sp-stat-status text-${as_.c}">${as_.l}</div></div></div>
      <div class="col-6 col-lg-3"><div class="sp-stat-card sp-stat-green"><div class="sp-stat-icon"><i class="fas fa-star"></i></div><div class="sp-stat-val">${avg}</div><div class="sp-stat-lbl">Avg Marks</div><div class="sp-stat-status text-${og.c}">Grade ${og.l}</div></div></div>
      <div class="col-6 col-lg-3"><div class="sp-stat-card sp-stat-purple"><div class="sp-stat-icon"><i class="fas fa-book"></i></div><div class="sp-stat-val">${sm.length}</div><div class="sp-stat-lbl">Subjects</div><div class="sp-stat-status text-primary">This Semester</div></div></div>
      <div class="col-6 col-lg-3"><div class="sp-stat-card sp-stat-orange"><div class="sp-stat-icon"><i class="fas fa-award"></i></div><div class="sp-stat-val">${og.l}</div><div class="sp-stat-lbl">Overall Grade</div><div class="sp-stat-status text-${og.c}">${avg}/100</div></div></div>
    </div>
    <div class="row g-4">
      <div class="col-12 col-md-5">
        <div class="card h-100"><div class="card-header"><h6 class="card-title mb-0"><i class="fas fa-calendar-check me-2"></i>Attendance</h6></div>
        <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
          <div class="attendance-circle mb-3"><svg viewBox="0 0 120 120" class="attendance-svg"><circle cx="60" cy="60" r="50" fill="none" stroke="#f1f5f9" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="${s.attendance>=75?'#10b981':'#ef4444'}" stroke-width="12" stroke-dasharray="${Math.round(s.attendance*3.14)} 314" stroke-linecap="round" transform="rotate(-90 60 60)"/></svg><div class="attendance-text"><span class="att-percent">${s.attendance}%</span></div></div>
          <span class="badge bg-${as_.c} fs-6 px-3 py-2">${as_.l}</span>
          <p class="text-muted small mt-2 text-center">${s.attendance>=75?'<i class="fas fa-check-circle text-success me-1"></i>You meet the 75% minimum.':'<i class="fas fa-exclamation-triangle text-danger me-1"></i>Below 75% minimum.'}</p>
        </div></div>
      </div>
      <div class="col-12 col-md-7">
        <div class="card h-100"><div class="card-header d-flex justify-content-between align-items-center"><h6 class="card-title mb-0"><i class="fas fa-chart-bar me-2"></i>Subject Marks</h6><span class="badge bg-primary">Avg: ${avg}/100</span></div>
        <div class="card-body">${sm.map(m=>`<div class="mb-3"><div class="d-flex justify-content-between mb-1"><span class="fw-semibold small">${m.subject}</span><div class="d-flex align-items-center gap-2"><span class="fw-bold small">${m.mark}/100</span><span class="badge bg-${m.grade.c}" style="min-width:32px">${m.grade.l}</span></div></div><div class="progress" style="height:8px"><div class="progress-bar bg-${m.grade.c}" style="width:${m.mark}%"></div></div></div>`).join('')}</div></div>
      </div>
    </div>
  </section>

  <section id="profile" class="sp-section">
    <h5 class="sp-section-title"><i class="fas fa-user-circle me-2"></i>My Profile</h5>
    <div class="row g-4">
      <div class="col-12 col-md-4"><div class="card text-center"><div class="card-body py-4"><div class="sp-profile-avatar">${s.name.charAt(0)}</div><h5 class="mt-3 mb-1">${s.name}</h5><p class="text-muted mb-2"><code>${s.usn}</code></p><span class="badge bg-primary-soft text-primary">${s.department}</span></div></div></div>
      <div class="col-12 col-md-8"><div class="card h-100"><div class="card-header"><h6 class="card-title mb-0">Personal Details</h6></div><div class="card-body"><div class="sp-detail-grid">
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-id-badge me-2 text-primary"></i>Student ID</span><span class="sp-detail-value">${s.id}</span></div>
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-user me-2 text-primary"></i>Full Name</span><span class="sp-detail-value">${s.name}</span></div>
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-id-card me-2 text-primary"></i>USN</span><span class="sp-detail-value"><code>${s.usn}</code></span></div>
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-envelope me-2 text-primary"></i>Email</span><span class="sp-detail-value">${s.email}</span></div>
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-building me-2 text-primary"></i>Department</span><span class="sp-detail-value">${s.department}</span></div>
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-book me-2 text-primary"></i>Semester</span><span class="sp-detail-value">Semester ${s.semester}</span></div>
        <div class="sp-detail-item"><span class="sp-detail-label"><i class="fas fa-calendar me-2 text-primary"></i>Enrolled On</span><span class="sp-detail-value">${new Date(s.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}</span></div>
      </div></div></div></div>
    </div>
  </section>

  <section id="attendance" class="sp-section">
    <h5 class="sp-section-title"><i class="fas fa-calendar-check me-2"></i>Attendance Details</h5>
    <div class="row g-4">
      <div class="col-12 col-md-5"><div class="card"><div class="card-body text-center py-5">
        <div class="attendance-circle mx-auto mb-4" style="width:160px;height:160px"><svg viewBox="0 0 120 120" style="width:160px;height:160px"><circle cx="60" cy="60" r="50" fill="none" stroke="#f1f5f9" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="${s.attendance>=75?'#10b981':'#ef4444'}" stroke-width="10" stroke-dasharray="${Math.round(s.attendance*3.14)} 314" stroke-linecap="round" transform="rotate(-90 60 60)"/></svg><div class="attendance-text"><span style="font-size:28px;font-weight:700">${s.attendance}%</span></div></div>
        <h4 class="text-${as_.c}">${as_.l}</h4><p class="text-muted">Current Attendance</p>
      </div></div></div>
      <div class="col-12 col-md-7"><div class="card h-100"><div class="card-header"><h6 class="card-title mb-0">Attendance Breakdown</h6></div><div class="card-body">
        ${[{l:'Excellent',min:85,max:100,c:'success'},{l:'Good',min:75,max:84,c:'primary'},{l:'Average',min:65,max:74,c:'warning'},{l:'Low',min:0,max:64,c:'danger'}].map(b=>`
        <div class="sp-att-band ${s.attendance>=b.min&&s.attendance<=b.max?'active-band border-'+b.c:''}">
          <div class="d-flex justify-content-between align-items-center">
            <div><span class="badge bg-${b.c} me-2">${b.l}</span><span class="text-muted small">${b.min}% – ${b.max}%</span></div>
            ${s.attendance>=b.min&&s.attendance<=b.max?`<span class="badge bg-${b.c}-soft text-${b.c}"><i class="fas fa-check-circle me-1"></i>Your Range</span>`:''}
          </div>
        </div>`).join('')}
        <div class="mt-4 p-3 rounded" style="background:var(--bg,#f8fafc)">
          ${s.attendance>=75?`<p class="mb-0 text-success"><i class="fas fa-check-circle me-2"></i>You meet the minimum 75% requirement. Keep it up!</p>`:`<p class="mb-0 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Below 75%. You need <strong>${75-s.attendance}%</strong> more to meet the minimum.</p>`}
        </div>
      </div></div></div>
    </div>
  </section>

  <section id="marks" class="sp-section">
    <h5 class="sp-section-title"><i class="fas fa-chart-bar me-2"></i>Marks & Grades</h5>
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="sp-marks-summary-card"><div class="sp-marks-big text-${og.c}">${avg}</div><div class="sp-marks-sub">Average Score</div></div></div>
      <div class="col-6 col-md-3"><div class="sp-marks-summary-card"><div class="sp-marks-big text-${og.c}">${og.l}</div><div class="sp-marks-sub">Overall Grade</div></div></div>
      <div class="col-6 col-md-3"><div class="sp-marks-summary-card"><div class="sp-marks-big text-success">${sm.filter(s=>s.mark>=75).length}</div><div class="sp-marks-sub">Subjects Passed</div></div></div>
      <div class="col-6 col-md-3"><div class="sp-marks-summary-card"><div class="sp-marks-big text-danger">${sm.filter(s=>s.mark<50).length}</div><div class="sp-marks-sub">Subjects Failed</div></div></div>
    </div>
    <div class="row g-3 mb-4">${sm.map(m=>`
      <div class="col-12 col-sm-6 col-lg-4"><div class="sp-subject-card border-${m.grade.c}">
        <div class="d-flex justify-content-between align-items-start mb-3"><h6 class="mb-0 fw-bold">${m.subject}</h6><span class="sp-grade-badge bg-${m.grade.c}">${m.grade.l}</span></div>
        <div class="sp-marks-score text-${m.grade.c}">${m.mark}<span class="sp-marks-total">/100</span></div>
        <div class="progress mt-2" style="height:8px"><div class="progress-bar bg-${m.grade.c}" style="width:${m.mark}%"></div></div>
      </div></div>`).join('')}</div>
    <div class="card"><div class="card-header"><h6 class="card-title mb-0">Detailed Marks Sheet</h6></div><div class="card-body p-0">
      <table class="table table-hover mb-0"><thead class="table-light"><tr><th>Subject</th><th>Marks</th><th>Out of</th><th>%</th><th>Grade</th><th>Status</th></tr></thead>
      <tbody>${sm.map(m=>`<tr><td class="fw-semibold">${m.subject}</td><td class="fw-bold text-${m.grade.c}">${m.mark}</td><td class="text-muted">100</td><td>${m.mark}%</td><td><span class="badge bg-${m.grade.c}">${m.grade.l}</span></td><td>${m.mark>=50?'<span class="badge bg-success-soft text-success"><i class="fas fa-check me-1"></i>Pass</span>':'<span class="badge bg-danger-soft text-danger"><i class="fas fa-times me-1"></i>Fail</span>'}</td></tr>`).join('')}
      <tr class="table-light"><td class="fw-bold">Total / Average</td><td class="fw-bold text-primary">${sm.reduce((a,s)=>a+s.mark,0)} / ${avg}</td><td class="text-muted">${sm.length*100}</td><td class="fw-bold">${avg}%</td><td><span class="badge bg-${og.c}">${og.l}</span></td><td></td></tr>
      </tbody></table>
    </div></div>
  </section>

  <section id="performance" class="sp-section">
    <h5 class="sp-section-title"><i class="fas fa-chart-line me-2"></i>Performance Analytics</h5>
    <div class="row g-4">
      <div class="col-12 col-lg-6"><div class="card"><div class="card-header"><h6 class="card-title mb-0">Subject Marks (Bar)</h6></div><div class="card-body"><canvas id="barChart" height="260"></canvas></div></div></div>
      <div class="col-12 col-lg-6"><div class="card"><div class="card-header"><h6 class="card-title mb-0">Performance Radar</h6></div><div class="card-body"><canvas id="radarChart" height="260"></canvas></div></div></div>
      <div class="col-12"><div class="card"><div class="card-header"><h6 class="card-title mb-0">Grade Distribution</h6></div><div class="card-body d-flex justify-content-center"><div style="max-width:400px;width:100%"><canvas id="doughnutChart" height="220"></canvas></div></div></div></div>
    </div>
  </section>`;
}

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault(); await api.studentLogout(); location.href = 'login.html';
});

init();
</script>
</body>
</html>
