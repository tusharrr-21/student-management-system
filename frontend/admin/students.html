<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Students | EduManage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-wrapper">
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-graduation-cap"></i><span class="logo-text">EduManage</span></div></div>
    <div class="sidebar-user"><div class="user-avatar"><i class="fas fa-user-shield"></i></div><div class="user-info"><span class="user-name" id="adminName">Admin</span><span class="user-role">Administrator</span></div></div>
    <ul class="sidebar-nav">
      <li class="nav-label">Main Menu</li>
      <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
      <li class="nav-item"><a href="students.html" class="nav-link active"><i class="fas fa-user-graduate"></i><span>Students</span></a></li>
      <li class="nav-item"><a href="student-form.html" class="nav-link"><i class="fas fa-user-plus"></i><span>Add Student</span></a></li>
      <li class="nav-label">Reports</li>
      <li class="nav-item"><a href="reports.html?type=attendance" class="nav-link"><i class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
      <li class="nav-item"><a href="reports.html?type=marks" class="nav-link"><i class="fas fa-chart-bar"></i><span>Marks</span></a></li>
      <li class="nav-label">Account</li>
      <li class="nav-item"><a href="#" class="nav-link text-danger-nav" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
    </ul>
  </nav>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h5 class="page-title mb-0">Students</h5></div>
      <div class="topbar-right"><a href="student-form.html" class="btn btn-success btn-sm"><i class="fas fa-plus me-1"></i>Add Student</a></div>
    </header>
    <div class="content-area">
      <div id="alertBox"></div>
      <!-- Filters -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label fw-semibold">Search</label>
              <div class="input-group"><span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Name, USN, Email..."/>
              </div>
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label fw-semibold">Department</label>
              <select class="form-select" id="deptFilter"><option value="">All Departments</option></select>
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label fw-semibold">Semester</label>
              <select class="form-select" id="semFilter"><option value="">All Semesters</option></select>
            </div>
            <div class="col-12 col-md-3 d-flex gap-2">
              <button class="btn btn-primary flex-grow-1" onclick="loadStudents()"><i class="fas fa-filter me-1"></i>Filter</button>
              <button class="btn btn-outline-secondary" onclick="clearFilters()"><i class="fas fa-times"></i></button>
            </div>
          </div>
        </div>
      </div>
      <!-- Table -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h6 class="card-title mb-0"><i class="fas fa-user-graduate me-2"></i>Students <span class="badge bg-primary ms-2" id="countBadge">0</span></h6>
          <button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light"><tr><th>Student</th><th>USN</th><th>Department</th><th>Semester</th><th>Attendance</th><th>Avg Marks</th><th>Status</th><th class="text-center">Actions</th></tr></thead>
              <tbody id="studentsTable"><tr><td colspan="8" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card-footer text-muted small" id="tableFooter"></div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0"><h5 class="modal-title text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><p>Delete <strong id="delName"></strong>?</p><p class="text-muted small">This cannot be undone.</p></div>
      <div class="modal-footer border-0">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmDelBtn"><i class="fas fa-trash me-1"></i>Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
let allStudents = [], deleteId = null;

function showAlert(msg, type = 'success') {
  const box = document.getElementById('alertBox');
  box.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show"><i class="fas fa-check-circle me-2"></i>${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
  setTimeout(() => { try { bootstrap.Alert.getOrCreateInstance(box.querySelector('.alert')).close(); } catch{} }, 3000);
}

async function init() {
  try { const me = await api.adminMe(); document.getElementById('adminName').textContent = me.data.name; }
  catch { location.href = 'login.html'; return; }
  await loadStudents();
  // Populate filters
  const depts = [...new Set(allStudents.map(s => s.department))].sort();
  const sems  = [...new Set(allStudents.map(s => s.semester))].sort((a,b) => a-b);
  depts.forEach(d => document.getElementById('deptFilter').innerHTML += `<option value="${d}">${d}</option>`);
  sems.forEach(s  => document.getElementById('semFilter').innerHTML  += `<option value="${s}">Sem ${s}</option>`);
}

async function loadStudents() {
  const search = document.getElementById('searchInput').value.trim();
  const dept   = document.getElementById('deptFilter').value;
  const sem    = document.getElementById('semFilter').value;
  let params = [];
  if (search) params.push(`search=${encodeURIComponent(search)}`);
  if (dept)   params.push(`dept=${encodeURIComponent(dept)}`);
  if (sem)    params.push(`sem=${encodeURIComponent(sem)}`);
  const qs = params.length ? '?' + params.join('&') : '';
  try {
    const { data } = await api.getStudents(qs);
    allStudents = data;
    renderTable(data);
  } catch(e) { console.error(e); }
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('deptFilter').value  = '';
  document.getElementById('semFilter').value   = '';
  loadStudents();
}

function renderTable(students) {
  document.getElementById('countBadge').textContent = students.length;
  document.getElementById('tableFooter').textContent = `Showing ${students.length} student(s)`;
  const tbody = document.getElementById('studentsTable');
  if (!students.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5"><div class="empty-state"><i class="fas fa-user-slash"></i><p>No students found.</p><a href="student-form.html" class="btn btn-primary btn-sm">Add First Student</a></div></td></tr>`;
    return;
  }
  tbody.innerHTML = students.map(s => {
    const marks = Object.values(s.marks);
    const avg   = Math.round(marks.reduce((a,b)=>a+b,0)/marks.length);
    const color = s.attendance>=85?'success':s.attendance>=75?'primary':s.attendance>=65?'warning':'danger';
    const label = s.attendance>=85?'Excellent':s.attendance>=75?'Good':s.attendance>=65?'Average':'Low';
    return `<tr>
      <td><div class="d-flex align-items-center gap-3"><div class="student-avatar">${s.name.charAt(0)}</div><div><div class="fw-semibold">${s.name}</div><small class="text-muted">${s.email}</small></div></div></td>
      <td><code class="text-primary">${s.usn}</code></td>
      <td><span class="dept-badge">${s.department}</span></td>
      <td><span class="badge bg-info-soft text-info">Sem ${s.semester}</span></td>
      <td><div class="d-flex align-items-center gap-2" style="min-width:120px"><div class="progress flex-grow-1" style="height:8px"><div class="progress-bar bg-${color}" style="width:${s.attendance}%"></div></div><span class="fw-semibold text-${color}">${s.attendance}%</span></div></td>
      <td><span class="fw-semibold ${avg>=75?'text-success':avg>=50?'text-warning':'text-danger'}">${avg}/100</span></td>
      <td><span class="badge bg-${color}-soft text-${color}">${label}</span></td>
      <td><div class="d-flex justify-content-center gap-1">
        <a href="student-detail.html?id=${s.id}" class="btn btn-sm btn-outline-info" title="View"><i class="fas fa-eye"></i></a>
        <a href="student-form.html?id=${s.id}" class="btn btn-sm btn-outline-warning" title="Edit"><i class="fas fa-edit"></i></a>
        <button class="btn btn-sm btn-outline-danger" onclick="openDelete('${s.id}','${s.name}')" title="Delete"><i class="fas fa-trash"></i></button>
      </div></td>
    </tr>`;
  }).join('');
}

function openDelete(id, name) {
  deleteId = id;
  document.getElementById('delName').textContent = name;
  new bootstrap.Modal(document.getElementById('deleteModal')).show();
}

document.getElementById('confirmDelBtn').addEventListener('click', async () => {
  try {
    await api.deleteStudent(deleteId);
    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
    showAlert('Student deleted successfully.');
    loadStudents();
  } catch(e) { showAlert(e.message, 'danger'); }
});

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault(); await api.adminLogout(); location.href = 'login.html';
});

// Search on Enter
document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') loadStudents(); });

init();
</script>
</body>
</html>
