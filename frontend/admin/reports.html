<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reports | EduManage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="../css/style.css" rel="stylesheet"/>
</head>
<body>
<div class="app-wrapper">
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-graduation-cap"></i><span class="logo-text">EduManage</span></div></div>
    <div class="sidebar-user"><div class="user-avatar"><i class="fas fa-user-shield"></i></div><div class="user-info"><span class="user-name" id="adminName">Admin</span><span class="user-role">Administrator</span></div></div>
    <ul class="sidebar-nav">
      <li class="nav-label">Main Menu</li>
      <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
      <li class="nav-item"><a href="students.html" class="nav-link"><i class="fas fa-user-graduate"></i><span>Students</span></a></li>
      <li class="nav-item"><a href="student-form.html" class="nav-link"><i class="fas fa-user-plus"></i><span>Add Student</span></a></li>
      <li class="nav-label">Reports</li>
      <li class="nav-item"><a href="reports.html?type=attendance" class="nav-link" id="navAtt"><i class="fas fa-calendar-check"></i><span>Attendance</span></a></li>
      <li class="nav-item"><a href="reports.html?type=marks" class="nav-link" id="navMarks"><i class="fas fa-chart-bar"></i><span>Marks</span></a></li>
      <li class="nav-label">Account</li>
      <li class="nav-item"><a href="#" class="nav-link text-danger-nav" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
    </ul>
  </nav>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><h5 class="page-title mb-0" id="pageTitle">Report</h5></div>
      <div class="topbar-right">
        <div class="btn-group btn-group-sm">
          <a href="reports.html?type=attendance" class="btn btn-outline-primary" id="btnAtt"><i class="fas fa-calendar-check me-1"></i>Attendance</a>
          <a href="reports.html?type=marks" class="btn btn-outline-primary" id="btnMarks"><i class="fas fa-chart-bar me-1"></i>Marks</a>
        </div>
      </div>
    </header>
    <div class="content-area" id="reportContent">
      <div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../js/api.js"></script>
<script>
const type = new URLSearchParams(location.search).get('type') || 'attendance';

function grade(m){if(m>=90)return{l:'A+',c:'success'};if(m>=80)return{l:'A',c:'success'};if(m>=70)return{l:'B',c:'primary'};if(m>=60)return{l:'C',c:'warning'};if(m>=50)return{l:'D',c:'warning'};return{l:'F',c:'danger'};}

async function init() {
  try { const me = await api.adminMe(); document.getElementById('adminName').textContent = me.data.name; }
  catch { location.href = 'login.html'; return; }

  if (type === 'attendance') {
    document.getElementById('pageTitle').textContent = 'Attendance Report';
    document.getElementById('navAtt').classList.add('active');
    document.getElementById('btnAtt').classList.replace('btn-outline-primary','btn-primary');
    await renderAttendance();
  } else {
    document.getElementById('pageTitle').textContent = 'Marks Report';
    document.getElementById('navMarks').classList.add('active');
    document.getElementById('btnMarks').classList.replace('btn-outline-primary','btn-primary');
    await renderMarks();
  }
}

async function renderAttendance() {
  const { data: students } = await api.getStudents();
  students.sort((a,b) => a.attendance - b.attendance);
  const excellent = students.filter(s=>s.attendance>=85).length;
  const good      = students.filter(s=>s.attendance>=75&&s.attendance<85).length;
  const average   = students.filter(s=>s.attendance>=65&&s.attendance<75).length;
  const low       = students.filter(s=>s.attendance<65).length;
  const avgAtt    = students.length ? Math.round(students.reduce((a,s)=>a+s.attendance,0)/students.length) : 0;

  document.getElementById('reportContent').innerHTML = `
    <div class="row g-4 mb-4">
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-green"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-info"><h2 class="stat-number">${excellent}</h2><p class="stat-label">Excellent (≥85%)</p></div></div></div>
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-blue"><div class="stat-icon"><i class="fas fa-thumbs-up"></i></div><div class="stat-info"><h2 class="stat-number">${good}</h2><p class="stat-label">Good (75–84%)</p></div></div></div>
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-orange"><div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><h2 class="stat-number">${average}</h2><p class="stat-label">Average (65–74%)</p></div></div></div>
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-purple"><div class="stat-icon"><i class="fas fa-times-circle"></i></div><div class="stat-info"><h2 class="stat-number">${low}</h2><p class="stat-label">Low (&lt;65%)</p></div></div></div>
    </div>
    <div class="row g-4 mb-4">
      <div class="col-12 col-lg-5"><div class="card h-100"><div class="card-header"><h6 class="card-title mb-0"><i class="fas fa-chart-pie me-2"></i>Distribution</h6></div><div class="card-body d-flex flex-column align-items-center justify-content-center"><canvas id="attPie" style="max-height:260px"></canvas><div class="mt-3"><span class="badge bg-primary fs-6">Overall Avg: ${avgAtt}%</span></div></div></div></div>
      <div class="col-12 col-lg-7"><div class="card h-100"><div class="card-header"><h6 class="card-title mb-0"><i class="fas fa-chart-bar me-2"></i>Per Student</h6></div><div class="card-body"><canvas id="attBar" style="max-height:280px"></canvas></div></div></div>
    </div>
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center"><h6 class="card-title mb-0"><i class="fas fa-list me-2"></i>All Students — Lowest First</h6><button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button></div>
      <div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>#</th><th>Student</th><th>USN</th><th>Department</th><th>Semester</th><th>Attendance</th><th>Status</th><th>Action</th></tr></thead>
        <tbody>${students.map((s,i)=>{const color=s.attendance>=85?'success':s.attendance>=75?'primary':s.attendance>=65?'warning':'danger';const label=s.attendance>=85?'Excellent':s.attendance>=75?'Good':s.attendance>=65?'Average':'Low';return`<tr><td class="text-muted">${i+1}</td><td><div class="d-flex align-items-center gap-2"><div class="student-avatar-sm">${s.name.charAt(0)}</div><div><div class="fw-semibold">${s.name}</div><small class="text-muted">${s.email}</small></div></div></td><td><code class="text-primary">${s.usn}</code></td><td><span class="dept-badge">${s.department}</span></td><td><span class="badge bg-info-soft text-info">Sem ${s.semester}</span></td><td style="min-width:160px"><div class="d-flex align-items-center gap-2"><div class="progress flex-grow-1" style="height:10px"><div class="progress-bar bg-${color}" style="width:${s.attendance}%"></div></div><span class="fw-bold text-${color}">${s.attendance}%</span></div></td><td><span class="badge bg-${color}-soft text-${color}">${label}</span></td><td><a href="student-detail.html?id=${s.id}" class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i></a></td></tr>`;}).join('')}</tbody>
      </table></div></div>
      <div class="card-footer text-muted small">Total: <strong>${students.length}</strong> | Below 75%: <strong class="text-danger">${average+low}</strong></div>
    </div>`;

  new Chart(document.getElementById('attPie'),{type:'doughnut',data:{labels:['Excellent','Good','Average','Low'],datasets:[{data:[excellent,good,average,low],backgroundColor:['#10b981','#4f46e5','#f59e0b','#ef4444'],borderWidth:3,borderColor:'#fff'}]},options:{cutout:'60%',plugins:{legend:{position:'bottom',labels:{padding:12,usePointStyle:true}}}}});
  new Chart(document.getElementById('attBar'),{type:'bar',data:{labels:students.map(s=>s.name.split(' ')[0]),datasets:[{label:'Attendance %',data:students.map(s=>s.attendance),backgroundColor:students.map(s=>s.attendance>=85?'#10b981':s.attendance>=75?'#4f46e5':s.attendance>=65?'#f59e0b':'#ef4444'),borderRadius:6,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
}

async function renderMarks() {
  const { data: students } = await api.getStudents();
  const withAvg = students.map(s=>{const vals=Object.values(s.marks);const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);return{...s,avgMark:avg,grade:grade(avg)};}).sort((a,b)=>b.avgMark-a.avgMark);
  const subjects=['mathematics','physics','chemistry','programming','english'];
  const subjectAvgs=subjects.map(sub=>({subject:sub.charAt(0).toUpperCase()+sub.slice(1),avg:students.length?Math.round(students.reduce((a,s)=>a+s.marks[sub],0)/students.length):0}));
  const overallAvg=withAvg.length?Math.round(withAvg.reduce((a,s)=>a+s.avgMark,0)/withAvg.length):0;
  const aPlus=withAvg.filter(s=>s.avgMark>=90).length,a=withAvg.filter(s=>s.avgMark>=80&&s.avgMark<90).length,b=withAvg.filter(s=>s.avgMark>=70&&s.avgMark<80).length,c=withAvg.filter(s=>s.avgMark>=60&&s.avgMark<70).length,fail=withAvg.filter(s=>s.avgMark<50).length;

  document.getElementById('reportContent').innerHTML = `
    <div class="row g-4 mb-4">
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-green"><div class="stat-icon"><i class="fas fa-trophy"></i></div><div class="stat-info"><h2 class="stat-number">${aPlus+a}</h2><p class="stat-label">A/A+ Grade (≥80)</p></div></div></div>
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-blue"><div class="stat-icon"><i class="fas fa-medal"></i></div><div class="stat-info"><h2 class="stat-number">${b}</h2><p class="stat-label">B Grade (70–79)</p></div></div></div>
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-orange"><div class="stat-icon"><i class="fas fa-exclamation-circle"></i></div><div class="stat-info"><h2 class="stat-number">${c}</h2><p class="stat-label">C Grade (60–69)</p></div></div></div>
      <div class="col-6 col-xl-3"><div class="stat-card stat-card-purple"><div class="stat-icon"><i class="fas fa-times-circle"></i></div><div class="stat-info"><h2 class="stat-number">${fail}</h2><p class="stat-label">Fail (&lt;50)</p></div></div></div>
    </div>
    <div class="row g-4 mb-4">
      <div class="col-12 col-lg-6"><div class="card h-100"><div class="card-header"><h6 class="card-title mb-0"><i class="fas fa-chart-bar me-2"></i>Subject Averages</h6></div><div class="card-body"><canvas id="subChart" style="max-height:280px"></canvas></div></div></div>
      <div class="col-12 col-lg-6"><div class="card h-100"><div class="card-header"><h6 class="card-title mb-0"><i class="fas fa-chart-line me-2"></i>Student Rankings</h6></div><div class="card-body"><canvas id="rankChart" style="max-height:280px"></canvas></div></div></div>
    </div>
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center"><h6 class="card-title mb-0"><i class="fas fa-list me-2"></i>Ranked by Average Marks</h6><div class="d-flex gap-2"><span class="badge bg-primary">Overall Avg: ${overallAvg}/100</span><button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button></div></div>
      <div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Rank</th><th>Student</th><th>USN</th><th>Dept</th><th>Math</th><th>Physics</th><th>Chemistry</th><th>Programming</th><th>English</th><th>Average</th><th>Grade</th></tr></thead>
        <tbody>${withAvg.map((s,i)=>`<tr><td>${i===0?'<span class="badge bg-warning text-dark"><i class="fas fa-trophy me-1"></i>1st</span>':i===1?'<span class="badge bg-secondary">2nd</span>':i===2?'<span class="badge bg-danger" style="background:#cd7f32!important">3rd</span>':`<span class="text-muted">#${i+1}</span>`}</td><td><div class="d-flex align-items-center gap-2"><div class="student-avatar-sm">${s.name.charAt(0)}</div><strong>${s.name}</strong></div></td><td><code class="text-primary">${s.usn}</code></td><td><span class="dept-badge">${s.department}</span></td><td class="${s.marks.mathematics>=75?'text-success':'text-danger'} fw-semibold">${s.marks.mathematics}</td><td class="${s.marks.physics>=75?'text-success':'text-danger'} fw-semibold">${s.marks.physics}</td><td class="${s.marks.chemistry>=75?'text-success':'text-danger'} fw-semibold">${s.marks.chemistry}</td><td class="${s.marks.programming>=75?'text-success':'text-danger'} fw-semibold">${s.marks.programming}</td><td class="${s.marks.english>=75?'text-success':'text-danger'} fw-semibold">${s.marks.english}</td><td><span class="fw-bold fs-6 text-${s.grade.c}">${s.avgMark}</span><small class="text-muted">/100</small></td><td><span class="badge bg-${s.grade.c}">${s.grade.l}</span></td></tr>`).join('')}</tbody>
      </table></div></div>
    </div>`;

  new Chart(document.getElementById('subChart'),{type:'bar',data:{labels:subjectAvgs.map(s=>s.subject),datasets:[{label:'Avg',data:subjectAvgs.map(s=>s.avg),backgroundColor:['#4f46e5','#06b6d4','#10b981','#f59e0b','#ef4444'],borderRadius:8,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
  new Chart(document.getElementById('rankChart'),{type:'line',data:{labels:withAvg.map(s=>s.name.split(' ')[0]),datasets:[{label:'Avg Marks',data:withAvg.map(s=>s.avgMark),borderColor:'#4f46e5',backgroundColor:'rgba(79,70,229,0.1)',pointBackgroundColor:'#4f46e5',pointRadius:5,fill:true,tension:0.4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
}

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault(); await api.adminLogout(); location.href = 'login.html';
});
init();
</script>
</body>
</html>
